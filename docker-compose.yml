services:
  kostay-next:
    container_name: kostay-next
    restart: always
    image: node:22
    ports:
      - 4000:3000
    environment:
      - PORT=3000

    volumes:
      - ./:/usr/src/kostay-next
    working_dir: /usr/src/kostay-next

    networks:
      - client-network

    # FOR PRODUCTION
    command: bash -c "yarn && yarn run build && yarn run start"

networks:
  client-network:
    driver: bridge