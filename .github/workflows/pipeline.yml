name: frontend pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, modification]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: frontend-checks-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      IMAGE: kostay-frontend:${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Typecheck and build production image
        shell: bash
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --build-arg REACT_APP_API_URL=https://api.kostay.kr \
            --build-arg REACT_APP_API_GRAPHQL_URL=https://api.kostay.kr/graphql \
            --build-arg REACT_APP_API_WS=wss://api.kostay.kr \
            --tag "$IMAGE" .
      - name: Check standalone server and static assets
        shell: bash
        run: |
          set -euo pipefail
          container=$(docker run -d -p 127.0.0.1:3100:3000 "$IMAGE")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          curl --fail --silent --show-error --retry 12 --retry-connrefused --retry-delay 2 http://127.0.0.1:3100/api/health
          curl --fail --silent --show-error http://127.0.0.1:3100/ > "$RUNNER_TEMP/home.html"
          python3 - <<'PYTHON'
          import os, re, urllib.request
          from pathlib import Path
          html = Path(os.environ['RUNNER_TEMP'], 'home.html').read_text()
          assets = re.findall(r'(?:src|href)="([^" ]*/_next/static/[^" ]+)"', html)
          assert assets, 'No compiled assets found in homepage'
          for asset in assets[:3]:
              assert asset.startswith('/_next/static/'), 'Unexpected asset origin'
              with urllib.request.urlopen('http://127.0.0.1:3100' + asset, timeout=15) as response:
                  assert response.status == 200
          PYTHON
      - name: Export tested image for deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          docker image save "$IMAGE" | gzip -1 > "$RUNNER_TEMP/frontend.tar.gz"
      - name: Store tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-${{ github.sha }}
          path: ${{ runner.temp }}/frontend.tar.gz
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  deploy:
    name: Deploy frontend
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: production-frontend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Reject a superseded release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo 'Main has moved; deploy the newer workflow run instead.' >&2
            exit 1
          fi
      - name: Deploy the exact tested image
        env:
          LIGHTSAIL_DEPLOY_KEY: ${{ secrets.LIGHTSAIL_DEPLOY_KEY }}
        shell: bash
        run: bash deploy/send-image.sh "$RUNNER_TEMP/release/frontend.tar.gz"
